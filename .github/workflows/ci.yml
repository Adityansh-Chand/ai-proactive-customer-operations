name: CI

on:
  push:
  pull_request:

jobs:
  test-and-evaluate:
    name: Test and evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Prove the committed corpus and classifiers are reproducible rather than
      # trusting the files in the repo.
      - name: Corpus is reproducible
        run: python training/generate_corpus.py --check
      - name: Committed metrics are reproducible
        run: python training/train.py --verify

      - name: Run tests
        run: python -m pytest -q
      - name: Run evaluation
        run: python evaluation/evaluate.py

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --file Dockerfile --tag customer-operations:${{ github.sha }} .
